# The document root is web/, not the project root: config/, vendor/ and .env must
# never be reachable over HTTP.
<VirtualHost *:80>
	DocumentRoot /var/www/html/web

	<Directory /var/www/html/web>
		Options -Indexes +FollowSymLinks
		AllowOverride All
		Require all granted
	</Directory>

	# Requesting wp-config.php executes it and returns an empty page rather than
	# leaking anything, but there is no reason for it to be reachable at all.
	<Files "wp-config.php">
		Require all denied
	</Files>

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
