; Development-oriented settings. Errors are logged, never rendered into the page:
; display_errors would corrupt JSON and AJAX responses.
display_errors = Off
log_errors = On
error_reporting = E_ALL
error_log = /dev/stderr

memory_limit = 512M
max_execution_time = 120

upload_max_filesize = 64M
post_max_size = 64M
max_file_uploads = 20

; Opcache revalidates on every request so edited files take effect immediately.
opcache.enable = 1
opcache.revalidate_freq = 0
opcache.validate_timestamps = 1
