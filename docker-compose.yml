# The project name is derived from the directory name.

# Every container runs the same code from the same bind mount: WordPress reads
# its configuration from config/, which reads .env, so there is no per-service
# environment block to keep in sync.
x-project-volume: &project-volume
  - ./:/var/www/html

services:
  # MariaDB, not MySQL, on purpose: MySQL 8.0.19+ dropped integer display width,
  # so `bigint(20)` in a DDL statement no longer matches the `bigint` reported by
  # DESCRIBE — which makes WordPress dbDelta() emit an ALTER on every plugin
  # activation. MariaDB still reports `bigint(20)`. It also has clean arm64 tags.
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-wordpress}
      MARIADB_USER: ${DB_USER:-wordpress}
      MARIADB_PASSWORD: ${DB_PASSWORD:-wordpress}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes: *project-volume

  # Composer runs against the bind-mounted project so vendor/ and web/wp land on
  # the host, where an editor can index them. Started on demand by bin/composer.
  composer:
    image: composer:2
    profiles: ["tools"]
    working_dir: /var/www/html
    volumes: *project-volume

  # One-shot WP-CLI runner, invoked through `bin/wp`. wp-cli.yml points it at
  # web/wp. user 33:33 is required because we bypass the image entrypoint that
  # would otherwise drop privileges: WP-CLI refuses to run as root.
  wpcli:
    image: wordpress:cli-php8.3
    profiles: ["tools"]
    user: "33:33"
    working_dir: /var/www/html
    depends_on:
      db:
        condition: service_healthy
    volumes: *project-volume

  # WP-Cron is disabled in config/application.php, so nothing would ever run on a
  # site nobody visits: wp-cron.php is only triggered by page loads. This loop is
  # the real scheduler that makes scheduled events actually fire.
  cron:
    image: wordpress:cli-php8.3
    restart: unless-stopped
    user: "33:33"
    working_dir: /var/www/html
    entrypoint: ["/bin/sh", "/var/www/html/bin/cron-loop.sh"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      CRON_INTERVAL: ${CRON_INTERVAL:-60}
    volumes: *project-volume

volumes:
  db_data:
